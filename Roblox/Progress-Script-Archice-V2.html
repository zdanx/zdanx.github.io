<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script Archive v2 - Pembaruan Sistem</title>
    <!-- Menggunakan font futuristik dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #00f3ff;
            --secondary-color: #bc13fe;
            --bg-color: #050505;
            --glass-bg: rgba(10, 10, 15, 0.6);
            --glass-border: rgba(0, 243, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-color);
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* --- Latar Belakang Animasi Grid & Cahaya --- */
        .bg-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 200vw;
            height: 200vh;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: gridMove 20s linear infinite;
            z-index: 1;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(40px) translateZ(-200px); }
        }

        .glow-sphere {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 1;
            opacity: 0.6;
            animation: pulseGlow 8s alternate infinite;
        }

        .sphere-1 {
            width: 400px;
            height: 400px;
            background: var(--primary-color);
            top: -100px;
            left: -100px;
        }

        .sphere-2 {
            width: 300px;
            height: 300px;
            background: var(--secondary-color);
            bottom: -50px;
            right: -50px;
            animation-delay: -4s;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.4; }
            50% { transform: scale(1.2) translate(50px, 20px); opacity: 0.7; }
            100% { transform: scale(0.9) translate(-20px, -40px); opacity: 0.4; }
        }

        /* --- Kartu Utama (Glassmorphism) --- */
        .container {
            position: relative;
            z-index: 10;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 50px;
            width: 90%;
            max-width: 700px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.1),
                        inset 0 0 20px rgba(0, 243, 255, 0.05);
            text-align: center;
            overflow: hidden;
        }

        /* Dekorasi sudut kartu */
        .corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }
        .corner-tl { top: 15px; left: 15px; border-top-color: var(--primary-color); border-left-color: var(--primary-color); }
        .corner-tr { top: 15px; right: 15px; border-top-color: var(--primary-color); border-right-color: var(--primary-color); }
        .corner-bl { bottom: 15px; left: 15px; border-bottom-color: var(--primary-color); border-left-color: var(--primary-color); }
        .corner-br { bottom: 15px; right: 15px; border-bottom-color: var(--primary-color); border-right-color: var(--primary-color); }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.8rem;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 10px var(--primary-color),
                         0 0 20px var(--primary-color),
                         0 0 40px rgba(0, 243, 255, 0.5);
            animation: textGlow 2s infinite alternate;
        }

        .version {
            color: var(--secondary-color);
            text-shadow: 0 0 10px var(--secondary-color),
                         0 0 20px var(--secondary-color);
        }

        @keyframes textGlow {
            0% { text-shadow: 0 0 10px var(--primary-color), 0 0 20px var(--primary-color); }
            100% { text-shadow: 0 0 15px var(--primary-color), 0 0 30px var(--primary-color), 0 0 50px var(--primary-color); }
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #a0c0d0;
            margin-bottom: 50px;
            letter-spacing: 1.5px;
        }

        /* --- Progress Bar Canggih --- */
        .progress-section {
            margin: 30px 0;
            position: relative;
        }

        .percentage-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 15px;
            text-shadow: 0 0 15px var(--primary-color);
            display: flex;
            justify-content: center;
            align-items: baseline;
        }

        .percentage-symbol {
            font-size: 2rem;
            margin-left: 5px;
            color: var(--primary-color);
        }

        .progress-track {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .progress-fill {
            height: 100%;
            width: 0%; /* Akan diatur oleh JavaScript */
            background: linear-gradient(90deg, transparent, var(--primary-color), #fff);
            border-radius: 10px;
            box-shadow: 0 0 15px var(--primary-color),
                        0 0 30px var(--primary-color);
            transition: width 2s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
        }

        /* Efek kilauan yang bergerak di dalam bar */
        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* --- Teks Status Dinamis --- */
        .status-box {
            margin-top: 30px;
            display: inline-block;
            padding: 8px 20px;
            background: rgba(0, 243, 255, 0.1);
            border-radius: 4px;
            border-left: 3px solid var(--primary-color);
            border-right: 3px solid var(--primary-color);
            font-size: 1rem;
            letter-spacing: 2px;
            color: #00f3ff;
            animation: blinkBox 2s infinite;
        }

        @keyframes blinkBox {
            0%, 100% { border-color: var(--primary-color); opacity: 1; }
            50% { border-color: rgba(0, 243, 255, 0.2); opacity: 0.7; }
        }

        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }

        /* Responsif untuk HP */
        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            p.subtitle { font-size: 1rem; margin-bottom: 30px;}
            .percentage-display { font-size: 3rem; }
            .container { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <!-- Latar Belakang Canggih -->
    <div class="bg-grid"></div>
    <div class="glow-sphere sphere-1"></div>
    <div class="glow-sphere sphere-2"></div>

    <!-- Konten Utama -->
    <div class="container">
        <!-- Dekorasi Sudut -->
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>

        <h1>Script Archive <span class="version">V2</span></h1>
        <p class="subtitle">Sistem sedang direkonstruksi ulang</p>

        <div class="progress-section">
            <div class="percentage-display">
                <span id="progress-number">0</span><span class="percentage-symbol">%</span>
            </div>
            
            <div class="progress-track">
                <div class="progress-fill" id="progress-bar"></div>
            </div>
        </div>

        <div class="status-box">
            <span id="status-text">MENGINISIALISASI SISTEM</span><span class="loading-dots"></span>
        </div>
    </div>

    <script>
        // =========================================================================
        // PENGATURAN PROGRESS
        // Ubah nilai variabel di bawah ini (0 - 100) untuk memperbarui progress bar
        // =========================================================================
        const TARGET_PROGRESS = 75; 
        // =========================================================================

        window.addEventListener('DOMContentLoaded', () => {
            const progressBar = document.getElementById('progress-bar');
            const progressNumber = document.getElementById('progress-number');
            const statusText = document.getElementById('status-text');

            // 1. Animasi Bar terisi setelah halaman dimuat (delay kecil agar efeknya terlihat)
            setTimeout(() => {
                progressBar.style.width = TARGET_PROGRESS + '%';
            }, 300);

            // 2. Animasi Angka Penghitung (Counter)
            let currentNum = 0;
            const duration = 2000; // 2 detik
            const fps = 60;
            const totalFrames = (duration / 1000) * fps;
            const increment = TARGET_PROGRESS / totalFrames;
            
            // Efek Easing lambat di akhir
            const easeOutQuart = (t) => 1 - Math.pow(1 - t, 4);

            let frame = 0;
            const animateCounter = setInterval(() => {
                frame++;
                const progress = frame / totalFrames;
                const easedProgress = easeOutQuart(progress);
                
                currentNum = easedProgress * TARGET_PROGRESS;
                
                if (frame >= totalFrames || currentNum >= TARGET_PROGRESS) {
                    progressNumber.innerText = TARGET_PROGRESS;
                    clearInterval(animateCounter);
                } else {
                    progressNumber.innerText = Math.floor(currentNum);
                }
            }, 1000 / fps);

            // 3. Logika Teks Status Dinamis berdasarkan Persentase
            setTimeout(() => {
                if (TARGET_PROGRESS < 25) {
                    statusText.innerText = "MERANCANG STRUKTUR DATABASE";
                } else if (TARGET_PROGRESS < 30) {
                    statusText.innerText = "MENGEMBANGKAN BACKEND SISTEM";
                } else if (TARGET_PROGRESS < 42) {
                    statusText.innerText = "MEMBANGUN ANTARMUKA (UI/UX)";
                } else if (TARGET_PROGRESS < 100) {
                    statusText.innerText = "FINISHING & BUG TESTING";
                } else {
                    statusText.innerText = "SISTEM SIAP DILUNCURKAN";
                    // Menghilangkan loading dots saat 100%
                    document.querySelector('.loading-dots').style.display = 'none';
                    progressBar.style.background = "linear-gradient(90deg, transparent, #00ff88, #fff)";
                    progressBar.style.boxShadow = "0 0 15px #00ff88, 0 0 30px #00ff88";
                    statusText.style.color = "#00ff88";
                    statusText.parentElement.style.borderColor = "#00ff88";
                }
            }, duration);
        });
    </script>
</body>
</html>
